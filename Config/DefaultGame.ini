[/Script/UnrealEd.ProjectPackagingSettings]
; Materials C++ loads by soft path at runtime; nothing in a map references them, so the cook skips them
; unless listed (first package 19.10: "SkipPackage ... does not exist" for all but Hull). Assets found by
; ConstructorHelpers finders need no entry: they load with the class and are cooked with it.
; The suit projector (UJamWeldProjectorComponent, UJamHullToolsComponent).
+DirectoriesToAlwaysCook=(Path="/Game/JamArt/Materials/Hull")
; Muzzle flash, smoke cards and the volumetric cloud (UJamMuzzleFxComponent).
+DirectoriesToAlwaysCook=(Path="/Game/JamArt/FX")
; SV-98 lens and reticle, the red dot (UJamScopeComponent).
+DirectoriesToAlwaysCook=(Path="/Game/JamArt/Materials/Weapons")
; Space dust specks (AJamZeroGPawn::DustMaterial).
+DirectoriesToAlwaysCook=(Path="/Game/Jam/Materials")
; MindKore's bodycam lens (JamLens.h) and visor blood (JamVisorBlood.h).
+DirectoriesToAlwaysCook=(Path="/Game/MindKore/PostProcess")

[/Script/Engine.AssetManagerSettings]
; The engine's GameFeatures plugin (AllToolsets -> GameFeaturesToolset -> GameFeatures) fails the cook without a rule
; for its asset type: "Asset Manager settings do not include an entry for assets of type GameFeatureData".
; The jam has no game features; the entry only satisfies that check. Editor-only: the game has no
; GameFeatures module, and a runtime rule fails an ensure in UAssetManager (packaged log 19.10).
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
