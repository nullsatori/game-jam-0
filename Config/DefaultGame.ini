[/Script/UnrealEd.ProjectPackagingSettings]
; Materials C++ loads by soft path at runtime; nothing in a map references them, so the cook skips them
; unless listed (first package 19.10: "SkipPackage ... does not exist" for all but Hull). Assets found by
; ConstructorHelpers finders need no entry: they load with the class and are cooked with it.
; The suit projector (UOSWeldProjectorComponent, UOSHullToolsComponent).
+DirectoriesToAlwaysCook=(Path="/Game/OSArt/Materials/Hull")
; Muzzle flash, smoke cards and the volumetric cloud (UOSMuzzleFxComponent).
+DirectoriesToAlwaysCook=(Path="/Game/JamArt/FX")
; SV-98 lens and reticle, the red dot (UOSScopeComponent).
+DirectoriesToAlwaysCook=(Path="/Game/OSArt/Materials/Weapons")
; Space dust specks (AOSZeroGPawn::DustMaterial).
+DirectoriesToAlwaysCook=(Path="/Game/OS/Materials")
; MindKore's bodycam lens (OSLens.h) and visor blood (OSVisorBlood.h).
+DirectoriesToAlwaysCook=(Path="/Game/MindKore/PostProcess")
; The debug menu's built-in test presets (UOSTestPreset, listed through the asset registry, nothing references them).
+DirectoriesToAlwaysCook=(Path="/Game/OS/Debug")
; The RMB-93, loaded by OSMakeRmb93 when a pickup hands it over (OSRmb93.cpp).
+DirectoriesToAlwaysCook=(Path="/Game/OSArt/Weapons/RMB93")

