+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,Name="Shot",DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False)
+Profiles=(Name="MKCharacterBody",CollisionEnabled=QueryOnly,ObjectTypeName="Pawn",CustomResponses=((Channel="Pawn",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Block),(Channel="Shot",Response=ECR_Block)),HelpMessage="MindKore character body mesh: blocks AI sight (Visibility) and gunfire (Shot) so a body is a solid target even outside its hit zones.",bCanModify=True)

