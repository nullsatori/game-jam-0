; RetainOnLoad (1), not the engine's LoadOnDemand: a wave's first chunk stays in memory from load, so the
; first shot of each gun no longer waits ~250 ms for its audio from disk (jam-sync 19.10, Scripts/os_sync_reduce.py).
au.streamcache.SoundWaveDefaultLoadingBehavior=1

[/Script/Engine.Engine]
; 2 cm, not the engine's 10: the guns aimed (Source/MindKore/OSScope.cpp) sit closer to the eye than 10 cm -
; the pump gun's comb under the cheek, the SV-98's kick toward the eyepiece.
NearClipPlane=2.0

[SystemSettings]
; DLAA by default (owner 2026-10-22): the NVIDIA DLSS plugin (8.9.0) at 100 % screen percentage, i.e. DLSS
; anti-aliasing at native resolution, the same setup as MindKore. The plugin is optional and not in git
; (Docs/Development.md, "DLSS"): without it, or on a non-NVIDIA GPU, the engine falls back to TSR at
; native resolution. Ray Reconstruction off (DenoiserMode 0): Lumen keeps its own denoiser.
; Back to TSR: delete this block.
r.NGX.DLSS.Enable=1
r.NGX.DLSS.DenoiserMode=0
r.ScreenPercentage=100
; The muzzle smoke (Docs/RecoilWeapons-SmokeSim.md): the heterogeneous volume marched at full resolution and without
; per-frame jitter, so each voxel of the smoke grid stays a crisp cube under DLAA (half resolution and jitter blurred
; the dither into mush). Scalability sets DownsampleFactor 2; this overrides it. Cost: os.Weapons.Smoke budget.
r.HeterogeneousVolumes.DownsampleFactor=1
r.HeterogeneousVolumes.Jitter=0
; The march step, in the volume's local units - a grid cell, 5 cm (HeterogeneousVolumesRayMarchingTypes.ush:
; CalcStepSize). 0.3 = 1.5 cm: at most half the drawn pixel (UOSMuzzleFxComponent::VoxelPixelCm, 3 cm), or the
; pixels alias into a shimmer that changes with the view (owner 22.10, «рябит»; the old 4 was 20 cm). Cost for three
; shotgun clouds (os.Weapons.Smoke budget, 23.10, clouds alive their whole life): pixel 3 cm / 0.3 - 1.32 ms,
; 2.5 cm / 0.25 - 1.96, 4 cm / 0.4 - 1.04.
r.HeterogeneousVolumes.StepSize=0.3

